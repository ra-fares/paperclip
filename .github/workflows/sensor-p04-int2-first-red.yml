# W01-011 fresh single CI run: full 16-case scoped PostgreSQL lock acceptance.
name: Sensor P04 W01-011 pool diagnostics
on:
  push:
    branches: [codex/w01-011-int2-pool-diagnostics]
    paths: [.github/workflows/sensor-p04-int2-first-red.yml]
permissions:
  contents: read
concurrency:
  group: sensor-p04-w01-011-final
  cancel-in-progress: false
jobs:
  isolated-postgres:
    if: github.repository == 'ra-fares/paperclip' && github.ref == 'refs/heads/codex/w01-011-int2-pool-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      PAPERCLIP_TELEMETRY_ENABLED: 'false'
      NO_COLOR: '1'
    steps:
      - name: Checkout immutable final SHA without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 40
      - name: Exact committed SHA, two-path fence and source manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .int2-evidence "$RUNNER_TEMP/w01-011-home"
          echo "PAPERCLIP_HOME=$RUNNER_TEMP/w01-011-home" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 16a445dd424026ed9a6e692925852aeb2eb8c511 HEAD
          git diff --name-only 16a445dd424026ed9a6e692925852aeb2eb8c511 HEAD | tee .int2-evidence/changed-files.txt
          while IFS= read -r p; do
            case "$p" in
              server/src/__tests__/issue-stalled-review-decision-routes.test.ts|.github/workflows/sensor-p04-int2-first-red.yml) ;;
              *) echo "OUTSIDE_W009_ALLOWLIST: $p" >&2; exit 1 ;;
            esac
          done < .int2-evidence/changed-files.txt
          test "$(wc -l < .int2-evidence/changed-files.txt)" -eq 2
          test -z "$(git diff --diff-filter=D --name-only 16a445dd424026ed9a6e692925852aeb2eb8c511 HEAD)"
          printf 'BASE=16a445dd424026ed9a6e692925852aeb2eb8c511\nSHA=%s\nRUN=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .int2-evidence/identity.txt
          git status --short --untracked-files=all > .int2-evidence/initial-git-status.txt
          sha256sum server/src/__tests__/issue-stalled-review-decision-routes.test.ts .github/workflows/sensor-p04-int2-first-red.yml > .int2-evidence/source-sha256.txt
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pnpm 9.15.4
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false
      - name: Frozen dependencies and build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee .int2-evidence/node-version.txt
          pnpm --version | tee .int2-evidence/pnpm-version.txt
          set +e
          pnpm install --frozen-lockfile 2>&1 | tee .int2-evidence/install.log
          install_code=${PIPESTATUS[0]}
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps 2>&1 | tee .int2-evidence/sdk.log
          sdk_code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$install_code" > .int2-evidence/install.exit_code
          printf '%s\n' "$sdk_code" > .int2-evidence/sdk.exit_code
          test "$install_code" -eq 0
          test "$sdk_code" -eq 0
          test -f server/node_modules/vitest/vitest.mjs
      - name: Migration integrity, server typecheck and two exact real-PG selectors
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm --filter @paperclipai/db run check:migrations > .int2-evidence/migrations.stdout 2> .int2-evidence/migrations.stderr
          migrations_code=$?
          pnpm --filter @paperclipai/server typecheck > .int2-evidence/typecheck.stdout 2> .int2-evidence/typecheck.stderr
          typecheck_code=$?
          set -e
          echo "$migrations_code" > .int2-evidence/migrations.exit_code
          echo "$typecheck_code" > .int2-evidence/typecheck.exit_code
          if [ "$migrations_code" -ne 0 ] || [ "$typecheck_code" -ne 0 ]; then
            echo 'Migration/typecheck failed, do not run expensive tests' >&2
            exit 1
          fi
          export INT2_W011_EVIDENCE_DIR="$GITHUB_WORKSPACE/.int2-evidence"
          export INT2_W009_EVIDENCE_DIR="$GITHUB_WORKSPACE/.int2-evidence"
          export INT2_POSITIVE_BCD_OBSERVATION_PATH="$GITHUB_WORKSPACE/.int2-evidence/positive-document-observation.json"
          run_named() {
            local label="$1" pattern="$2" code
            set +e
            node server/node_modules/vitest/vitest.mjs run --root server src/__tests__/issue-stalled-review-decision-routes.test.ts --reporter=json --outputFile="$GITHUB_WORKSPACE/.int2-evidence/vitest-$label.json" -t "$pattern" > ".int2-evidence/$label.stdout" 2> ".int2-evidence/$label.stderr"
            code=$?
            set -e
            echo "$code" > ".int2-evidence/$label.exit_code"
            echo "SELECTOR=$label EXIT=$code"
            tail -n 80 ".int2-evidence/$label.stderr" || true
            tail -n 60 ".int2-evidence/$label.stdout" || true
            return "$code"
          }
          run_named runtime_d_first 'P04 INT2 W009 lock_runtime_d_first: genuine BCD and PG lock'
          run_named document 'P04 INT2 BCD document: actual admitted run and independent reviewer'
      - name: Strict W011 two-case provenance, lock and documentary oracle
        if: always()
        shell: bash
        run: |
          mkdir -p .int2-evidence
          set +e
          node <<'NODE'
          const fs=require('node:fs'),dir='.int2-evidence';
          const tests={
            runtime_d_first:"P04 INT2 W009 lock_runtime_d_first: genuine BCD and PG lock",
            document:"P04 INT2 BCD document: actual admitted run and independent reviewer",
          };
          const other14=[
            'runtime_writer_first','retry_d_first','retry_writer_first',
            'forward_d_first','forward_writer_first','quarantine_d_first','quarantine_writer_first',
            'parent_drift','source_drift','indirect_material','indirect_aba','rollback','http_aba','native_retry'
          ];
          const read=n=>{try{return fs.readFileSync(dir+'/'+n,'utf8')}catch{return null}};
          const json=n=>{try{return JSON.parse(read(n))}catch{return null}};
          const code=n=>{const v=read(n+'.exit_code');return v===null?null:Number(v.trim())};
          const stages=n=>(read('stages-'+n+'.jsonl')??'').split('\n').filter(Boolean).map(line=>JSON.parse(line));
          const out={
            schema:'p04-int2-w011-classification.v1',
            sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,
            typecheck:code('typecheck'),migrations:code('migrations'),
            cases:{},lockOracle:null,documentOracle:false,stageOracle:{},
            other14:Object.fromEntries(other14.map(name=>[name,'NOT_RUN_BY_W011_SCOPE'])),
            sourceFiles:(read('changed-files.txt')??'').trim().split('\n').filter(Boolean),
          };
          let invalid=out.typecheck!==0||out.migrations!==0;
          for(const [label,name] of Object.entries(tests)){
            const report=json('vitest-'+label+'.json');
            const assertions=(report?.testResults??[]).flatMap(x=>x.assertionResults??[]);
            const matches=assertions.filter(t=>t.fullName===name||t.fullName?.endsWith(name));
            const executed=assertions.filter(t=>t.status==='passed'||t.status==='failed');
            const pass=matches.length===1&&executed.length===1&&matches[0].status==='passed'&&
              code(label)===0&&report?.numPassedTests===1&&report?.numFailedTests===0;
            out.cases[label]={
              name,selected:matches.length,executed:executed.length,status:matches[0]?.status??null,
              exitCode:code(label),classification:pass?'PASS':matches.length===0||executed.length===0?'NOT_RUN':'FAIL',
              failures:matches.flatMap(t=>t.failureMessages??[]),
            };
            if(!pass)invalid=true;
          }
          const lock=json('lock-lock_runtime_d_first.json');
          const expectedRoles=[['w009-D','w009-gate'],['w009-writer','w009-D']];
          const observed=Array.isArray(lock?.lockEvidence)
            ? lock.lockEvidence.map(l=>[l.waiterName,l.blockerName]) : [];
          const lockOkay=Boolean(
            lock?.mode==='lock_runtime_d_first'&&lock?.sourceRunId&&lock?.candidateId&&
            lock?.dHttp===200&&lock?.finalStatus==='done'&&lock?.acceptedAuditRows===1&&
            Array.isArray(lock?.originalAdapterCalls)&&lock.originalAdapterCalls.filter(id=>id===lock.sourceRunId).length===1&&
            JSON.stringify(observed)===JSON.stringify(expectedRoles)&&
            lock.lockEvidence.length===2&&lock.lockEvidence.every(l=>
              l.proven===true&&Number(l.waiterPid)>0&&Number(l.blockerPid)>0&&
              Array.isArray(l.blockingLockTypes)&&l.blockingLockTypes.length>0&&
              typeof l.waitSql==='string'&&typeof l.blockerSql==='string')
          );
          out.lockOracle={okay:lockOkay,expectedRoles,observedRoles:observed,
            waiterPids:lock?.lockEvidence?.map(l=>l.waiterPid)??[],
            blockerPids:lock?.lockEvidence?.map(l=>l.blockerPid)??[]};
          if(!lockOkay)invalid=true;

          const doc=json('positive-document-observation.json');
          out.documentOracle=Boolean(
            doc?.mode==='document'&&doc?.reviewerHttp===200&&doc?.after==='done'&&
            doc?.acceptedAuditRows===1&&doc?.sourceTerminal==='succeeded'&&
            Array.isArray(doc?.adapterCalls)&&doc.adapterCalls.filter(id=>id===doc.runId).length===1
          );
          if(!out.documentOracle)invalid=true;

          const requiredRuntime=[
            'before_pg_start','pg_started','source_pool_ready','seed_begin','seed_complete',
            'heartbeat_invoke_enter','admission_enter','adapter_enter','B_request_enter','B_request_result',
            'B_candidate_persisted','adapter_return','C_drain_enter','C_settled',
            'contention_pools_ready','contention_helper_enter','module_setup_complete',
            'gate_trigger_installed','gate_acquired','D_launch','writer_launch','gate_release',
            'settlement_complete','contention_cleanup_complete','outer_cleanup_complete'
          ];
          const runtimeStages=stages('lock_runtime_d_first');
          const runtimeNames=runtimeStages.map(e=>e.stage);
          const waitEvents=runtimeStages.filter(e=>e.stage==='wait_observed');
          const runtimeStageOkay=requiredRuntime.every(name=>runtimeNames.includes(name))&&
            waitEvents.length===2&&runtimeStages[0]?.stage==='before_pg_start';
          out.stageOracle.runtime_d_first={
            okay:runtimeStageOkay,lastStage:runtimeNames.at(-1)??null,
            eventCount:runtimeStages.length,waitCount:waitEvents.length,
            missing:requiredRuntime.filter(name=>!runtimeNames.includes(name)),
          };
          if(!runtimeStageOkay)invalid=true;

          const requiredDocument=[
            'before_pg_start','pg_started','source_pool_ready','seed_begin','seed_complete',
            'heartbeat_invoke_enter','admission_enter','adapter_enter','B_request_enter','B_request_result',
            'B_candidate_persisted','adapter_return','C_drain_enter','C_settled',
            'D_request_enter','D_request_result','outer_cleanup_complete'
          ];
          const documentStages=stages('document');
          const documentNames=documentStages.map(e=>e.stage);
          const documentStageOkay=requiredDocument.every(name=>documentNames.includes(name))&&
            documentStages[0]?.stage==='before_pg_start';
          out.stageOracle.document={
            okay:documentStageOkay,lastStage:documentNames.at(-1)??null,
            eventCount:documentStages.length,
            missing:requiredDocument.filter(name=>!documentNames.includes(name)),
          };
          if(!documentStageOkay)invalid=true;

          out.overall=invalid?'FAIL_OR_NOT_RUN':'PASS_SCOPED';
          fs.writeFileSync(dir+'/classification.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          if(invalid)process.exitCode=1;
          NODE
          classifier_code=$?
          printf '%s\n' "$classifier_code" > .int2-evidence/classifier.exit_code
          exit "$classifier_code"

      - name: Always write W011 diagnostic manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .int2-evidence
          find .int2-evidence -maxdepth 1 -type f ! -name evidence-sha256.txt ! -name diagnostic-manifest.json -print0 | sort -z | xargs -0 -r sha256sum > .int2-evidence/evidence-sha256.txt
          node <<'NODE'
          const fs=require('node:fs'),dir='.int2-evidence';
          const files=fs.readdirSync(dir).sort();
          const read=n=>{try{return fs.readFileSync(dir+'/'+n,'utf8')}catch{return null}};
          const tail=n=>{const s=read(n);if(!s)return null;const lines=s.trim().split('\n');return lines.slice(-8)};
          const manifest={
            schema:'p04-int2-w011-diagnostic-manifest.v1',
            sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,
            files,classification:read('classification.json')?JSON.parse(read('classification.json')):null,
            exits:{
              install:read('install.exit_code')?.trim()??null,
              sdk:read('sdk.exit_code')?.trim()??null,
              migrations:read('migrations.exit_code')?.trim()??null,
              typecheck:read('typecheck.exit_code')?.trim()??null,
              runtime_d_first:read('runtime_d_first.exit_code')?.trim()??null,
              document:read('document.exit_code')?.trim()??null,
              classifier:read('classifier.exit_code')?.trim()??null,
            },
            stageTails:{
              runtime_d_first:tail('stages-lock_runtime_d_first.jsonl'),
              document:tail('stages-document.jsonl'),
            },
          };
          fs.writeFileSync(dir+'/diagnostic-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
      - name: Always upload W011 original evidence, including failure and NOT_RUN
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w01-011-final-evidence
          path: .int2-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Ensure checkout tracked files unchanged
        if: always()
        run: git diff --exit-code
