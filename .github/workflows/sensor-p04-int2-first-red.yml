# W01-005 CI1: non-pruning schema migration generation only; no providers or deployment.
name: Sensor P04 W01-005 migration generator
on:
  push:
    branches: [codex/w01-005-int2-workspace-revision]
    paths: [.github/workflows/sensor-p04-int2-first-red.yml]
permissions:
  contents: read
concurrency:
  group: sensor-p04-w01-005-generator
  cancel-in-progress: false
jobs:
  migration-generation:
    if: github.repository == 'ra-fares/paperclip' && github.ref == 'refs/heads/codex/w01-005-int2-workspace-revision'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      PAPERCLIP_TELEMETRY_ENABLED: 'false'
    steps:
      - name: Checkout exact committed candidate with no retained write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 40
      - name: Source identity and allowlist, historical migration manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .int2-evidence/generated
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor c3c73673205c62eb6d5490417502126dc32726ff HEAD
          git diff --name-only c3c73673205c62eb6d5490417502126dc32726ff HEAD | tee .int2-evidence/changed-files.txt
          while IFS= read -r p; do
            case "$p" in
              packages/db/src/schema/project_workspaces.ts|packages/db/src/schema/execution_workspaces.ts|server/src/services/issues.ts|server/src/services/execution-workspaces.ts|server/src/services/workspace-runtime.ts|server/src/__tests__/issue-stalled-review-decision-routes.test.ts|.github/workflows/sensor-p04-int2-first-red.yml|packages/db/src/migrations/meta/_journal.json|packages/db/src/migrations/meta/0294_snapshot.json|packages/db/src/migrations/0294_*.sql) ;;
              *) echo "OUTSIDE_W01_005_WRITE_SET $p" >&2; exit 1 ;;
            esac
          done < .int2-evidence/changed-files.txt
          git ls-files packages/db/src/migrations/'*.sql' packages/db/src/migrations/meta/'*_snapshot.json' | sort > .int2-evidence/historical-files.txt
          while IFS= read -r p; do sha256sum "$p"; done < .int2-evidence/historical-files.txt > .int2-evidence/historical-sha256.txt
          printf 'SHA=%s\nRUN=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .int2-evidence/identity.txt
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: pnpm 9.15.4
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false
      - name: Frozen install and non-pruning migration generator
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee .int2-evidence/node-version.txt
          pnpm --version | tee .int2-evidence/pnpm-version.txt
          pnpm install --frozen-lockfile > .int2-evidence/install.stdout 2> .int2-evidence/install.stderr
          pnpm --filter @paperclipai/db run check:migrations > .int2-evidence/baseline-check.stdout 2> .int2-evidence/baseline-check.stderr
          pnpm --filter @paperclipai/db exec tsc -p tsconfig.json > .int2-evidence/compile.stdout 2> .int2-evidence/compile.stderr
          pnpm --filter @paperclipai/db exec drizzle-kit generate --config=drizzle.config.ts > .int2-evidence/generate.stdout 2> .int2-evidence/generate.stderr
          git diff --exit-code HEAD -- packages/db/src/migrations/'*.sql' packages/db/src/migrations/meta/'*_snapshot.json'
          git ls-files packages/db/src/migrations/'*.sql' packages/db/src/migrations/meta/'*_snapshot.json' | sort > .int2-evidence/historical-files-after.txt
          diff -u .int2-evidence/historical-files.txt .int2-evidence/historical-files-after.txt
          while IFS= read -r p; do sha256sum "$p"; done < .int2-evidence/historical-files.txt > .int2-evidence/historical-sha256-after.txt
          diff -u .int2-evidence/historical-sha256.txt .int2-evidence/historical-sha256-after.txt
          test "$(find packages/db/src/migrations -maxdepth 1 -name '0294_*.sql' | wc -l)" = 1
          test -f packages/db/src/migrations/meta/0294_snapshot.json
          cp packages/db/src/migrations/0294_*.sql .int2-evidence/generated/
          cp packages/db/src/migrations/meta/0294_snapshot.json .int2-evidence/generated/
          cp packages/db/src/migrations/meta/_journal.json .int2-evidence/generated/
          git diff -- packages/db/src/migrations/meta/_journal.json > .int2-evidence/journal.patch
          (cd .int2-evidence/generated && sha256sum * > ../generated-sha256.txt)
          git status --short --untracked-files=all > .int2-evidence/status.txt
          cat .int2-evidence/generate.stdout
          cat .int2-evidence/generated-sha256.txt
      - name: Always upload generated artifacts and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w01-005-ci1-generation
          path: .int2-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
