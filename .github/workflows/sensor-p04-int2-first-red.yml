# W01-005 CI2 final exact committed SHA: one bounded real-PG acceptance job.
name: Sensor P04 W01-005 workspace revision acceptance
on:
  push:
    branches: [codex/w01-005-int2-workspace-revision]
    paths: [.github/workflows/sensor-p04-int2-first-red.yml]
permissions:
  contents: read
concurrency:
  group: sensor-p04-w01-005-final
  cancel-in-progress: false
jobs:
  isolated-postgres:
    if: github.repository == 'ra-fares/paperclip' && github.ref == 'refs/heads/codex/w01-005-int2-workspace-revision'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      PAPERCLIP_TELEMETRY_ENABLED: 'false'
      NO_COLOR: '1'
    steps:
      - name: Checkout immutable final SHA without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 40
      - name: Exact source, ten-file fence and immutable historical migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .int2-evidence "$RUNNER_TEMP/w01-005-home"
          echo "PAPERCLIP_HOME=$RUNNER_TEMP/w01-005-home" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor c3c73673205c62eb6d5490417502126dc32726ff HEAD
          git diff --name-only c3c73673205c62eb6d5490417502126dc32726ff HEAD | tee .int2-evidence/changed-files.txt
          while IFS= read -r p; do
            case "$p" in
              packages/db/src/schema/project_workspaces.ts|packages/db/src/schema/execution_workspaces.ts|server/src/services/issues.ts|server/src/services/execution-workspaces.ts|server/src/services/workspace-runtime.ts|server/src/__tests__/issue-stalled-review-decision-routes.test.ts|.github/workflows/sensor-p04-int2-first-red.yml|packages/db/src/migrations/meta/_journal.json|packages/db/src/migrations/meta/0294_snapshot.json|packages/db/src/migrations/0294_freezing_beyonder.sql) ;;
              *) echo "OUTSIDE_W01_005_WRITE_SET $p" >&2; exit 1 ;;
            esac
          done < .int2-evidence/changed-files.txt
          test "$(wc -l < .int2-evidence/changed-files.txt)" -eq 10
          test -z "$(git diff --diff-filter=D --name-only c3c73673205c62eb6d5490417502126dc32726ff HEAD)"
          test -z "$(git diff --name-only c3c73673205c62eb6d5490417502126dc32726ff HEAD -- packages/db/src/migrations/meta/*_snapshot.json | grep -v '/0294_snapshot.json$' || true)"
          test "$(git rev-parse HEAD:packages/db/src/migrations/meta/0294_snapshot.json)" = 3a06cfd37dd5b0d5270d1af87e08b51b5b88efa5
          test "$(git rev-parse HEAD:packages/db/src/migrations/meta/_journal.json)" = 5d73b228ce5fdcb34a045a40fd7713942b521b6c
          sha256sum packages/db/src/migrations/0294_freezing_beyonder.sql packages/db/src/migrations/meta/0294_snapshot.json packages/db/src/migrations/meta/_journal.json > .int2-evidence/migration-sha256.txt
          printf 'BASE=c3c73673205c62eb6d5490417502126dc32726ff\nSHA=%s\nRUN=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .int2-evidence/identity.txt
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up pnpm 9.15.4
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false
      - name: Frozen dependencies and build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee .int2-evidence/node-version.txt
          pnpm --version | tee .int2-evidence/pnpm-version.txt
          pnpm install --frozen-lockfile > .int2-evidence/install.stdout 2> .int2-evidence/install.stderr
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps > .int2-evidence/sdk.stdout 2> .int2-evidence/sdk.stderr
          test -f server/node_modules/vitest/vitest.mjs
      - name: Run numbering checks, server typecheck and 8 named selected integration cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .int2-evidence
          set +e
          pnpm --filter @paperclipai/db run check:migrations > .int2-evidence/migrations.stdout 2> .int2-evidence/migrations.stderr
          printf '%s\n' "$?" > .int2-evidence/migrations.exit_code
          pnpm --filter @paperclipai/server typecheck > .int2-evidence/typecheck.stdout 2> .int2-evidence/typecheck.stderr
          printf '%s\n' "$?" > .int2-evidence/typecheck.exit_code
          set -e
          export INT2_HTTP_ABA_OBSERVATION_PATH="$GITHUB_WORKSPACE/.int2-evidence/http-aba-observation.json"
          export INT2_POSITIVE_BCD_OBSERVATION_PATH="$GITHUB_WORKSPACE/.int2-evidence/positive-document-observation.json"
          run_named() {
            local label="$1" pattern="$2" exit
            set +e
            node server/node_modules/vitest/vitest.mjs run --root server src/__tests__/issue-stalled-review-decision-routes.test.ts --reporter=json --outputFile="$GITHUB_WORKSPACE/.int2-evidence/vitest-$label.json" -t "$pattern" > ".int2-evidence/$label.stdout" 2> ".int2-evidence/$label.stderr"
            exit=$?
            set -e
            echo "$exit" > ".int2-evidence/$label.exit_code"
            echo "SELECTOR=$label EXIT=$exit"
            tail -n 50 ".int2-evidence/$label.stderr" || true
            tail -n 30 ".int2-evidence/$label.stdout" || true
          }
          run_named target 'P04 INT2 HTTP execution workspace branch ABA must reject stale candidate'
          run_named control 'P04 INT2 BCD document: actual admitted run and independent reviewer'
          run_named pw_aba 'P04 INT2 BCD project_workspace_identity_revision_aba_db: actual admitted run and independent reviewer'
          run_named old_candidate 'P04 INT2 BCD pre_revision_candidate: actual admitted run and independent reviewer'
          run_named config 'P04 INT2 BCD config_drift: actual admitted run and independent reviewer'
          run_named native 'P04 INT2 NATIVE_TX positive: committer-owned governed status decision'
          run_named revision_db 'W01-005 REAL PG identity revision: metadata, no-op, A-B-A, rollback, and BIGINT'
          run_named nongoverned 'still lets the pending execution-policy stage participant sign off as done'
      - name: Strict evidence and per-test execution classifier
        if: always()
        shell: bash
        run: |
          mkdir -p .int2-evidence
          node <<'NODE'
          const fs=require('node:fs');
          const dir='.int2-evidence';
          const tests={
            target:'P04 INT2 HTTP execution workspace branch ABA must reject stale candidate',
            control:'P04 INT2 BCD document: actual admitted run and independent reviewer',
            pw_aba:'P04 INT2 BCD project_workspace_identity_revision_aba_db: actual admitted run and independent reviewer',
            old_candidate:'P04 INT2 BCD pre_revision_candidate: actual admitted run and independent reviewer',
            config:'P04 INT2 BCD config_drift: actual admitted run and independent reviewer',
            native:'P04 INT2 NATIVE_TX positive: committer-owned governed status decision',
            revision_db:'W01-005 REAL PG identity revision: metadata, no-op, A-B-A, rollback, and BIGINT',
            nongoverned:'still lets the pending execution-policy stage participant sign off as done'
          };
          const read=n=>{try{return fs.readFileSync(dir+'/'+n,'utf8')}catch{return null}};
          const json=n=>{try{return JSON.parse(read(n))}catch{return null}};
          const code=n=>{const x=read(n+'.exit_code');return x==null?null:Number(x.trim())};
          const out={sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,cases:{},typecheck:code('typecheck'),migrations:code('migrations')};
          let bad=out.typecheck!==0||out.migrations!==0;
          for(const [label,name] of Object.entries(tests)){
            const doc=json('vitest-'+label+'.json'),assertions=(doc?.testResults??[]).flatMap(t=>t.assertionResults??[]);
            const matches=assertions.filter(t=>t.fullName===name||t.fullName?.endsWith(name));
            const executed=assertions.filter(t=>t.status==='passed'||t.status==='failed');
            const pass=matches.length===1&&executed.length===1&&matches[0].status==='passed'&&code(label)===0&&doc.numPassedTests===1&&doc.numFailedTests===0;
            out.cases[label]={name,selected:matches.length,executed:executed.length,status:matches[0]?.status??null,exitCode:code(label),failureMessages:matches.flatMap(t=>t.failureMessages??[]),classification:pass?'PASS':matches.length===0||executed.length===0?'NOT_RUN':'FAIL'};
            if(!pass)bad=true;
          }
          const o=json('http-aba-observation.json'),p=json('positive-document-observation.json');
          out.httpObservation=o;out.documentObservation=p;
          const steps=o?.steps??[],a=steps.find(x=>x.phase==='before_http_A'),
            b=steps.find(x=>x.phase==='after_http_B'),c=steps.find(x=>x.phase==='after_http_restored_A');
          const revised=a&&b&&c&&
            BigInt(String(b.identityRevision))===BigInt(String(a.identityRevision))+1n&&
            BigInt(String(c.identityRevision))===BigInt(String(a.identityRevision))+2n;
          out.httpPreconditions=Boolean(o?.preconditionsValid===true&&o.stage==='REVIEW_ATTEMPTED'&&
            o.receiptSchema==='sensor-direct-dispatch-claim.v2'&&o.sourceRunStatus==='succeeded'&&
            b?.httpStatus===200&&c?.httpStatus===200&&revised&&
            o.actualAdapterCalls?.includes(o.sourceRunId));
          out.httpOracle=Boolean(out.httpPreconditions&&o?.reviewerHttp===409&&
            o.reviewerCode==='governed_candidate_stale'&&o.finalStatus==='in_review'&&o.acceptedAuditRows===0);
          out.documentOracle=Boolean(p?.mode==='document'&&p.reviewerHttp===200&&p.after==='done'&&p.acceptedAuditRows===1);
          if(!out.httpOracle||!out.documentOracle)bad=true;
          out.overall=bad?'FAIL_OR_NOT_RUN':'PASS_SCOPED';
          fs.writeFileSync(dir+'/classification.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({sha:out.sha,run:out.run,overall:out.overall,typecheck:out.typecheck,migrations:out.migrations,
            cases:Object.fromEntries(Object.entries(out.cases).map(([k,v])=>[k,v.classification])),
            httpPreconditions:out.httpPreconditions,httpOracle:out.httpOracle,documentOracle:out.documentOracle},null,2));
          if(bad)process.exitCode=1;
          NODE
      - name: Always upload original evidence and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w01-005-ci2-acceptance-evidence
          path: .int2-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Ensure checkout tracked files unchanged
        if: always()
        run: git diff --exit-code
