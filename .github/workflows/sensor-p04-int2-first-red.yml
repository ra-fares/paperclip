# Historical first RED remains on its original branch. This is GREEN evaluation only.
name: Sensor P04 INT2 isolated acceptance
on:
  push:
    branches: [codex/p04-int2-acceptance-fix]
    paths:
      - .github/workflows/sensor-p04-int2-first-red.yml
      - packages/shared/src/validators/issue.ts
      - server/src/routes/issues.ts
      - server/src/services/issues.ts
      - server/src/services/heartbeat.ts
      - server/src/services/execution-recovery-resolution.ts
      - server/src/services/issue-tree-control.ts
      - server/src/services/execution-workspaces.ts
      - server/src/routes/execution-workspaces.ts
      - server/src/__tests__/issue-stalled-review-decision-routes.test.ts
      - server/src/__tests__/heartbeat-sensor-direct-admission.integration.test.ts
permissions:
  contents: read
concurrency:
  group: sensor-p04-int2-acceptance-fix
  cancel-in-progress: false
jobs:
  isolated-postgres:
    if: github.repository == 'ra-fares/paperclip' && github.ref == 'refs/heads/codex/p04-int2-acceptance-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      PAPERCLIP_TELEMETRY_ENABLED: 'false'
      NO_COLOR: '1'
    steps:
      - name: Checkout pinned candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 40
      - name: Verify ancestry and exact allowed diff
        run: |
          set -euo pipefail
          mkdir -p .int2-evidence "$RUNNER_TEMP/p04-int2-home"
          echo "PAPERCLIP_HOME=$RUNNER_TEMP/p04-int2-home" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor af05d88bc3064639f69cbc87932cc17cfba9dbd2 HEAD
          git diff --name-only af05d88bc3064639f69cbc87932cc17cfba9dbd2 HEAD | tee .int2-evidence/changed-files.txt
          while IFS= read -r f; do
            case "$f" in
              packages/shared/src/validators/issue.ts|server/src/routes/issues.ts|server/src/services/issues.ts|server/src/services/heartbeat.ts|server/src/services/execution-recovery-resolution.ts|server/src/services/issue-tree-control.ts|server/src/services/execution-workspaces.ts|server/src/routes/execution-workspaces.ts|server/src/__tests__/issue-stalled-review-decision-routes.test.ts|server/src/__tests__/heartbeat-sensor-direct-admission.integration.test.ts|.github/workflows/sensor-p04-int2-first-red.yml) ;;
              *) echo "OUTSIDE_WRITE_SET $f" >&2; exit 1 ;;
            esac
          done < .int2-evidence/changed-files.txt
          echo "BASE=af05d88bc3064639f69cbc87932cc17cfba9dbd2 SHA=$GITHUB_SHA RUN=$GITHUB_RUN_ID" > .int2-evidence/identity.txt
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Setup pnpm 9.15.4
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false
      - name: Frozen install and SDK
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
          test -f server/node_modules/vitest/vitest.mjs
      - name: Compile source and run four targeted PostgreSQL groups
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm --filter @paperclipai/server typecheck > .int2-evidence/typecheck.stdout 2> .int2-evidence/typecheck.stderr
          tsc=$?
          set -e
          echo "$tsc" > .int2-evidence/typecheck.exit_code
          echo "TYPECHECK_EXIT=$tsc"
          tail -n 100 .int2-evidence/typecheck.stdout || true
          tail -n 160 .int2-evidence/typecheck.stderr || true
          run_named () {
            local label="$1" file="$2" pattern="$3"
            set +e
            node server/node_modules/vitest/vitest.mjs run --root server "$file" --reporter=json --outputFile="../int2-$label.json" -t "$pattern" > ".int2-evidence/$label.stdout" 2> ".int2-evidence/$label.stderr"
            local rc=$?
            set -e
            echo "$rc" > ".int2-evidence/$label.exit_code"
            test ! -f "int2-$label.json" || cp "int2-$label.json" .int2-evidence/
          }
          run_named bcd src/__tests__/issue-stalled-review-decision-routes.test.ts 'P04 INT2 BCD'
          run_named board src/__tests__/issue-stalled-review-decision-routes.test.ts 'P04 INT2 RED: governed direct missing evidence must not close issue'
          run_named direct src/__tests__/heartbeat-sensor-direct-admission.integration.test.ts 'governed cline_local commits exactly one direct v2 completion pin and never replays'
          run_named ordinary src/__tests__/issue-stalled-review-decision-routes.test.ts 'rejects stale or covered reviews and serializes concurrent decisions'
      - name: Classify executed assertions (skips always NOT_RUN)
        run: |
          node <<'NODE'
          const fs=require("node:fs");
          const dir=".int2-evidence";
          const cases={
            bcd:["P04 INT2 BCD missing: actual admitted run and independent reviewer","P04 INT2 BCD document: actual admitted run and independent reviewer"],
            board:["P04 INT2 RED: governed direct missing evidence must not close issue"],
            direct:["governed cline_local commits exactly one direct v2 completion pin and never replays"],
            ordinary:["rejects stale or covered reviews and serializes concurrent decisions"]
          };
          const output={};
          let bad=fs.readFileSync(dir+"/typecheck.exit_code","utf8").trim()!=="0";
          output.typecheck=bad?"FAIL":"PASS";
          for(const [label,names] of Object.entries(cases)){
            const exitCode=Number(fs.readFileSync(dir+"/"+label+".exit_code","utf8"));
            let doc=null,error=null;
            try{doc=JSON.parse(fs.readFileSync(dir+"/int2-"+label+".json","utf8"))}catch(e){error=String(e)}
            const assertions=(doc?.testResults??[]).flatMap(x=>x.assertionResults??[]);
            const checks=names.map(name=>{
              const found=assertions.filter(x=>x.fullName?.includes(name));
              const status=found[0]?.status??null;
              const messages=found.flatMap(x=>x.failureMessages??[]);
              const stdout=fs.existsSync(dir+"/"+label+".stdout")?fs.readFileSync(dir+"/"+label+".stdout","utf8"):"";
              const source=[stdout,...messages].join("\\n");
              const observation=(source.match(/INT2_(?:BCD|REVIEW)_OBSERVATION\\s+(\\{[^\\n]+\\})/)??[])[1]??null;
              let classification=found.length!==1||status==="pending"||status==="skipped"?"NOT_RUN":
                (status==="passed"&&exitCode===0&&doc?.numFailedTests===0?"PASS":
                 status==="failed"?(observation?"FAIL":"INVALID_FIXTURE"):"INVALID_FIXTURE");
              // The historical first RED remains immutable. Should it ever
              // reproduce, classify the observed regression separately; it
              // is NOT a GREEN pass and never conceals a fixture error.
              if(label==="board"&&classification==="FAIL"&&observation) {
                try {
                  const o=JSON.parse(observation);
                  if(o.httpStatus===200&&o.dbStatus==="done")classification="EXPECTED_RED";
                }catch{}
              }
              return {name,classification,status,count:found.length,failureMessages:messages,observation};
            });
            if(checks.some(x=>x.classification!=="PASS")||exitCode!==0)bad=true;
            output[label]={exitCode,error,checks};
          }
          output.overall=bad?"FAIL_OR_NOT_RUN":"PASS";
          fs.writeFileSync(dir+"/classification.json",JSON.stringify(output,null,2));
          console.log(JSON.stringify(output,null,2));
          if(bad)process.exitCode=1;
          NODE
      - name: Upload all evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p04-int2-acceptance-evidence
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          path: .int2-evidence/
      - name: Ensure tracked checkout unchanged
        if: always()
        run: git diff --exit-code
