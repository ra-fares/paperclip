# W01-021: minimal reconcile lock-order fix, four existing contention selectors.
name: Sensor P04 W01-021 reconcile lock order
on:
  push:
    branches: [codex/w01-021-reconcile-lock-order]
    paths: [.github/workflows/sensor-p04-int2-first-red.yml]
permissions:
  contents: read
concurrency:
  group: sensor-p04-w01-021-one-run
  cancel-in-progress: false
jobs:
  isolated-postgres:
    if: github.repository == 'ra-fares/paperclip' && github.ref == 'refs/heads/codex/w01-021-reconcile-lock-order'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      PAPERCLIP_TELEMETRY_ENABLED: 'false'
      NO_COLOR: '1'
    steps:
      - name: Checkout exact commit without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 40

      - name: Exact base, three-file allowlist, immutable source manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .int2-evidence .int2-safe "$RUNNER_TEMP/w01-021-home"
          echo "PAPERCLIP_HOME=$RUNNER_TEMP/w01-021-home" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base=efcd44a05bfdd74bdc6551289e1c4b452850ee5a
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-only "$base" HEAD > .int2-evidence/changed-files.txt
          while IFS= read -r p; do
            case "$p" in
              server/src/services/execution-workspaces.ts|server/src/__tests__/issue-stalled-review-decision-routes.test.ts|.github/workflows/sensor-p04-int2-first-red.yml) ;;
              *) echo "OUTSIDE_W021_ALLOWLIST" >&2; exit 1 ;;
            esac
          done < .int2-evidence/changed-files.txt
          test "$(wc -l < .int2-evidence/changed-files.txt)" -eq 3
          test -z "$(git diff --diff-filter=D --name-only "$base" HEAD)"
          printf 'ASSIGNMENT=W01-021\nBASE=%s\nSHA=%s\nRUN=%s\nATTEMPT=%s\n' "$base" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .int2-evidence/identity.txt
          git status --short --untracked-files=all > .int2-evidence/initial-git-status.txt
          sha256sum server/src/services/execution-workspaces.ts server/src/__tests__/issue-stalled-review-decision-routes.test.ts .github/workflows/sensor-p04-int2-first-red.yml > .int2-evidence/source-sha256.txt

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: pnpm 9.15.4
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Frozen install, migration integrity and server typecheck
        shell: bash
        run: |
          set -euo pipefail
          node --version > .int2-evidence/node-version.txt
          pnpm --version > .int2-evidence/pnpm-version.txt
          if pnpm install --frozen-lockfile > .int2-evidence/install.log 2>&1; then install_code=0; else install_code=$?; fi
          printf '%s\n' "$install_code" > .int2-evidence/install.exit_code
          test "$install_code" -eq 0
          if pnpm --filter @paperclipai/plugin-sdk ensure-build-deps > .int2-evidence/sdk.log 2>&1; then sdk_code=0; else sdk_code=$?; fi
          printf '%s\n' "$sdk_code" > .int2-evidence/sdk.exit_code
          test "$sdk_code" -eq 0
          test -f server/node_modules/vitest/vitest.mjs
          if pnpm --filter @paperclipai/db run check:migrations > .int2-evidence/migrations.stdout 2> .int2-evidence/migrations.stderr; then migration_code=0; else migration_code=$?; fi
          printf '%s\n' "$migration_code" > .int2-evidence/migrations.exit_code
          test "$migration_code" -eq 0
          if pnpm --filter @paperclipai/server typecheck > .int2-evidence/typecheck.stdout 2> .int2-evidence/typecheck.stderr; then type_code=0; else type_code=$?; fi
          printf '%s\n' "$type_code" > .int2-evidence/typecheck.exit_code
          test "$type_code" -eq 0

      - name: Four exact reconcile selectors, fail-fast, disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          export INT2_W013_EVIDENCE_DIR="$GITHUB_WORKSPACE/.int2-evidence"
          export INT2_W012_EVIDENCE_DIR="$GITHUB_WORKSPACE/.int2-evidence"
          export INT2_W011_EVIDENCE_DIR="$GITHUB_WORKSPACE/.int2-evidence"
          export INT2_W009_EVIDENCE_DIR="$GITHUB_WORKSPACE/.int2-evidence"

          run_named() {
            local label="$1" pattern="$2" code
            if node server/node_modules/vitest/vitest.mjs run --root server src/__tests__/issue-stalled-review-decision-routes.test.ts --reporter=json --outputFile="$GITHUB_WORKSPACE/.int2-evidence/vitest-$label.json" -t "$pattern" > ".int2-evidence/$label.stdout" 2> ".int2-evidence/$label.stderr"; then
              code=0
            else
              code=$?
            fi
            printf '%s\n' "$code" > ".int2-evidence/$label.exit_code"
            echo "SELECTOR=$label EXIT=$code"
          }

          require_reconcile_observation() {
            local mode="$1"
            test -f ".int2-evidence/preflight-$mode.json"
            test -f ".int2-evidence/preassert-$mode.json"
            test ! -f ".int2-evidence/invalid-repro-$mode.json"
            node -e '
              const fs=require("fs");
              const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const a=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
              const v=a.queryVisibility;
              const ok=p.valid===true&&p.configuredLimitBytes===16384&&
                a.expectedQueryKind==="issues.select_for_update"&&
                a.actualQueryKind==="issues.select_for_update"&&
                a.observedBlockingEdge===true&&
                v?.captureComplete===true&&v?.clientTruncated===false&&
                v?.hasFromIssues===true&&v?.hasForUpdate===true;
              process.exit(ok?0:1);
            ' ".int2-evidence/preflight-$mode.json" ".int2-evidence/preassert-$mode.json"
          }

          require_pass() {
            local label="$1"
            test -f ".int2-evidence/$label.exit_code"
            test "$(cat ".int2-evidence/$label.exit_code")" -eq 0
          }

          run_named forward_d_first 'P04 INT2 W009 lock_forward_d_first: genuine BCD and PG lock'
          require_reconcile_observation lock_forward_d_first
          require_pass forward_d_first

          run_named forward_writer_first 'P04 INT2 W009 lock_forward_writer_first: genuine BCD and PG lock'
          require_reconcile_observation lock_forward_writer_first
          require_pass forward_writer_first

          run_named quarantine_d_first 'P04 INT2 W009 lock_quarantine_d_first: genuine BCD and PG lock'
          require_reconcile_observation lock_quarantine_d_first
          require_pass quarantine_d_first

          run_named quarantine_writer_first 'P04 INT2 W009 lock_quarantine_writer_first: genuine BCD and PG lock'
          require_reconcile_observation lock_quarantine_writer_first
          require_pass quarantine_writer_first

      - name: Always classify and materialize SAFE evidence only
        if: always()
        shell: bash
        run: |
          mkdir -p .int2-evidence .int2-safe
          node <<'NODE'
          const fs=require('node:fs'),dir='.int2-evidence',safe='.int2-safe';
          const names={
            forward_d_first:'P04 INT2 W009 lock_forward_d_first: genuine BCD and PG lock',
            forward_writer_first:'P04 INT2 W009 lock_forward_writer_first: genuine BCD and PG lock',
            quarantine_d_first:'P04 INT2 W009 lock_quarantine_d_first: genuine BCD and PG lock',
            quarantine_writer_first:'P04 INT2 W009 lock_quarantine_writer_first: genuine BCD and PG lock',
          };
          const mode={
            forward_d_first:'lock_forward_d_first',
            forward_writer_first:'lock_forward_writer_first',
            quarantine_d_first:'lock_quarantine_d_first',
            quarantine_writer_first:'lock_quarantine_writer_first',
          };
          const read=n=>{try{return fs.readFileSync(dir+'/'+n,'utf8')}catch{return null}};
          const json=n=>{try{const s=read(n);return s===null?null:JSON.parse(s)}catch{return null}};
          const code=n=>{const s=read(n+'.exit_code');return s===null?null:Number(s.trim())};
          const write=(n,v)=>fs.writeFileSync(safe+'/'+n,JSON.stringify(v,null,2)+'\n');
          const summary=(label,name)=>{
            const report=json('vitest-'+label+'.json');
            const all=(report?.testResults??[]).flatMap(x=>x.assertionResults??[]);
            const selected=all.filter(t=>t.fullName===name||t.fullName?.endsWith(name));
            const executed=selected.filter(t=>t.status==='passed'||t.status==='failed');
            const pass=selected.length===1&&executed.length===1&&selected[0].status==='passed'&&
              code(label)===0&&report?.numPassedTests===1&&report?.numFailedTests===0;
            return {name,selected:selected.length,executed:executed.length,status:selected[0]?.status??null,
              exitCode:code(label),classification:pass?'PASS':selected.length===0||executed.length===0?'NOT_RUN':'FAIL',
              failureCount:selected[0]?.failureMessages?.length??0};
          };
          const safeId=v=>typeof v==='string'&&/^[0-9a-f-]{36}$/i.test(v)?v:null;
          const safeInt=v=>Number.isSafeInteger(v)?v:null;
          const safeBool=v=>typeof v==='boolean'?v:null;
          const safeStatus=v=>['in_review','done','running','starting','succeeded','failed'].includes(v)?v:null;
          const roles=['w009-D','w009-writer','w009-gate','w009-observer'];
          const queryKinds=['issues.select_for_key_share','issues.select_for_update','issues.update','project_workspaces.select_for_update','execution_workspaces.select_for_update','advisory_lock','other'];
          const kind=v=>queryKinds.includes(v)?v:'other';
          const lockTypes=['transactionid','tuple','relation','advisory','virtualxid'];
          const lockModes=['ShareLock','ExclusiveLock','RowShareLock','RowExclusiveLock','AccessShareLock','AccessExclusiveLock','ShareUpdateExclusiveLock','ShareRowExclusiveLock'];
          const safeArray=(xs,allowed)=>Array.isArray(xs)?xs.slice(0,8).map(x=>allowed.includes(x)?x:'other'):[];
          const safeVisibility=v=>v?{
            configuredLimitBytes:safeInt(v.configuredLimitBytes),
            queryByteLength:safeInt(v.queryByteLength),
            clientTruncated:v.clientTruncated===false?false:null,
            captureComplete:v.captureComplete===true,
            hasFromIssues:v.hasFromIssues===true,
            hasForUpdate:v.hasForUpdate===true,
            hasForKeyShare:v.hasForKeyShare===true,
          }:null;
          const safeError=(v,depth=0)=>{
            if(!v||typeof v!=='object'||depth>4)return null;
            if(v.cycle===true)return {cycle:true};
            const atom=x=>typeof x==='string'&&/^[A-Za-z0-9_.-]{1,128}$/.test(x)?x:null;
            const code=x=>typeof x==='string'&&/^[A-Z0-9]{5}$/.test(x)?x:null;
            return {name:atom(v.name),code:code(v.code),routine:atom(v.routine),
              constraint:atom(v.constraint),table:atom(v.table),cause:safeError(v.cause,depth+1)};
          };
          const safeWait=v=>v&&typeof v==='object'?{
            waiterName:roles.includes(v.waiterName)?v.waiterName:null,
            blockerName:roles.includes(v.blockerName)?v.blockerName:null,
            waiterPid:Number.isSafeInteger(v.waiterPid)&&v.waiterPid>0?v.waiterPid:null,
            blockerPid:Number.isSafeInteger(v.blockerPid)&&v.blockerPid>0?v.blockerPid:null,
            waitEvent:['transactionid','tuple','relation','advisory'].includes(v.waitEvent)?v.waitEvent:null,
            waitSqlKind:kind(v.waitSqlKind),blockerSqlKind:kind(v.blockerSqlKind),
            blockingLockTypes:safeArray(v.blockingLockTypes,lockTypes),
            blockingLockModes:safeArray(v.blockingLockModes,lockModes),
            queryVisibility:safeVisibility(v.queryVisibility),proven:v.proven===true,
          }:null;
          const safePending=v=>v&&typeof v==='object'?{
            d:typeof v.d==='string'?v.d:null,writer:typeof v.writer==='string'?v.writer:null,gate:typeof v.gate==='string'?v.gate:null,
          }:null;
          const safeStage=x=>{
            const base={sequence:safeInt(x.sequence),stage:typeof x.stage==='string'&&/^[a-z0-9_]{1,80}$/.test(x.stage)?x.stage:null};
            if(x.stage==='wait_observed')return {...base,detail:safeWait(x)};
            if(x.stage==='pre_assert_wait_recorded')return {...base,detail:{
              assertionId:['w015_d_first_early_issue_wait','w015_writer_first_receipt_lock'].includes(x.assertionId)?x.assertionId:null,
              expectedQueryKind:kind(x.expectedQueryKind),actualQueryKind:kind(x.actualQueryKind),
              waiterRole:roles.includes(x.waiterRole)?x.waiterRole:null,blockerRole:roles.includes(x.blockerRole)?x.blockerRole:null,
              waiterPid:Number.isSafeInteger(x.waiterPid)&&x.waiterPid>0?x.waiterPid:null,
              blockerPid:Number.isSafeInteger(x.blockerPid)&&x.blockerPid>0?x.blockerPid:null,
              observedBlockingEdge:x.observedBlockingEdge===true,queryVisibility:safeVisibility(x.queryVisibility),
            }};
            if(x.stage==='contention_error')return {...base,detail:{
              error:safeError(x.error),pending:safePending(x.pending),
              lockEvidence:Array.isArray(x.lockEvidence)?x.lockEvidence.slice(0,4).map(safeWait):[],
            }};
            if(x.stage==='early_issue_wait_before_reservation')return {...base,detail:{
              sqlKind:kind(x.sqlKind),waiterPid:safeInt(x.waiterPid),blockerPid:safeInt(x.blockerPid),
              serviceRowsBeforeRelease:safeInt(x.serviceRowsBeforeRelease),spawnCountBeforeRelease:safeInt(x.spawnCountBeforeRelease),
            }};
            if(x.stage==='settlement_complete')return {...base,detail:{
              pending:safePending(x.pending),dHttp:safeInt(x.dHttp),writerOk:safeBool(x.writerOk),
            }};
            if(x.stage==='contention_cleanup_complete')return {...base,detail:{
              pending:safePending(x.pending),
              cleanupErrors:Array.isArray(x.cleanupErrors)?x.cleanupErrors.slice(0,8).map(safeError):[],
              primaryError:safeError(x.primaryError),
            }};
            if(x.stage==='outer_cleanup_complete')return {...base,detail:{cleanupErrorPresent:Boolean(x.cleanupError)}};
            return base;
          };
          const stageRows=m=>{
            const raw=read('stages-'+m+'.jsonl');
            if(!raw)return [];
            return raw.split('\n').filter(Boolean).flatMap(line=>{try{return [safeStage(JSON.parse(line))]}catch{return []}});
          };
          const safeLocks=label=>{
            const m=mode[label],d=json('lock-'+m+'.json');if(!d)return null;
            return {
              mode:m,sourceRunId:safeId(d.sourceRunId),candidateId:safeId(d.candidateId),
              dHttp:safeInt(d.dHttp),finalStatus:safeStatus(d.finalStatus),finalVersion:safeInt(d.finalVersion),
              acceptedAuditRows:safeInt(d.acceptedAuditRows),
              writerOk:typeof d.writerResult?.ok==='boolean'?d.writerResult.ok:null,
              writerErrorCode:typeof d.writerResult?.error?.code==='string'&&/^[A-Z0-9]{5}$/.test(d.writerResult.error.code)?d.writerResult.error.code:null,
              spawnCount:safeInt(d.spawnCount),
              runIds:Array.isArray(d.runIds)?d.runIds.slice(0,8).map(safeId).filter(Boolean):[],
              originalAdapterCalls:Array.isArray(d.originalAdapterCalls)?d.originalAdapterCalls.slice(0,8).map(safeId).filter(Boolean):[],
              serviceRowCount:Array.isArray(d.serviceRows)?d.serviceRows.length:null,
              earlyIssueWait:d.earlyIssueWait?{
                sqlKind:kind(d.earlyIssueWait.sqlKind),
                waiterPid:safeInt(d.earlyIssueWait.waiterPid),blockerPid:safeInt(d.earlyIssueWait.blockerPid),
                serviceRowsBeforeRelease:safeInt(d.earlyIssueWait.serviceRowsBeforeRelease),
                spawnCountBeforeRelease:safeInt(d.earlyIssueWait.spawnCountBeforeRelease),
              }:null,
              quarantineRescueStub:Array.isArray(d.events)&&d.events.some(e=>e?.name==='PRE_TX_RESCUE_STUB'),
              lockEvidence:Array.isArray(d.lockEvidence)?d.lockEvidence.slice(0,4).map(safeWait):[],
            };
          };
          const safePreflight=m=>{
            const v=json('preflight-'+m+'.json');return v?{
              case:m,configuredLimitBytes:safeInt(v.configuredLimitBytes),generatedQueryBytes:safeInt(v.generatedQueryBytes),
              safetyMarginBytes:1024,fullQueryKind:kind(v.fullQueryKind),prefix500QueryKind:kind(v.prefix500QueryKind),
              fullHasFromIssues:v.fullHasFromIssues===true,fullHasForUpdate:v.fullHasForUpdate===true,
              valid:v.valid===true,invalidReproPresent:json('invalid-repro-'+m+'.json')!==null,
            }:null;
          };
          const safePreassert=m=>{
            const v=json('preassert-'+m+'.json');return v?{
              schema:'p04-int2-w015-preassert.v1',case:m,
              assertionId:['w015_d_first_early_issue_wait','w015_writer_first_receipt_lock'].includes(v.assertionId)?v.assertionId:null,
              expectedQueryKind:kind(v.expectedQueryKind),actualQueryKind:kind(v.actualQueryKind),
              waiterRole:roles.includes(v.waiterRole)?v.waiterRole:null,blockerRole:roles.includes(v.blockerRole)?v.blockerRole:null,
              waiterPid:Number.isSafeInteger(v.waiterPid)&&v.waiterPid>0?v.waiterPid:null,
              blockerPid:Number.isSafeInteger(v.blockerPid)&&v.blockerPid>0?v.blockerPid:null,
              observedBlockingEdge:v.observedBlockingEdge===true,
              queryVisibility:safeVisibility(v.queryVisibility),
              lockTypes:safeArray(v.lockTypes,lockTypes),lockModes:safeArray(v.lockModes,lockModes),
            }:null;
          };

          const cases=Object.fromEntries(Object.entries(names).map(([k,v])=>[k,summary(k,v)]));
          for(const [k,v] of Object.entries(cases))write('vitest-'+k+'-summary.json',v);
          const stages={},cleanup={},locks={},preflights={},preassert={};
          for(const [label,m] of Object.entries(mode)){
            stages[label]=stageRows(m);
            cleanup[label]={
              outerComplete:stages[label].some(x=>x.stage==='outer_cleanup_complete'),
              contentionComplete:stages[label].some(x=>x.stage==='contention_cleanup_complete'),
            };
            locks[label]=safeLocks(label);
            preflights[label]=safePreflight(m);
            preassert[label]=safePreassert(m);
            write('stages-'+label+'.json',stages[label]);
          }

          const infra=['install','sdk','migrations','typecheck'].every(n=>code(n)===0);
          const passes=Object.values(cases).every(c=>c.classification==='PASS');
          const cleanupPass=Object.values(cleanup).every(c=>c.outerComplete===true&&c.contentionComplete===true);
          const visibilityOracle=Object.entries(preflights).every(([,v])=>v!==null&&v.valid===true&&
            v.configuredLimitBytes===16384&&v.generatedQueryBytes!==null&&
            v.generatedQueryBytes+1024<v.configuredLimitBytes&&
            v.fullQueryKind==='issues.select_for_update'&&v.prefix500QueryKind!=='issues.select_for_update'&&
            v.invalidReproPresent===false);
          const preassertOracle=Object.entries(preassert).every(([,v])=>v!==null&&
            v.expectedQueryKind==='issues.select_for_update'&&v.actualQueryKind==='issues.select_for_update'&&
            v.observedBlockingEdge===true&&v.waiterPid>0&&v.blockerPid>0&&
            v.queryVisibility?.captureComplete===true&&v.queryVisibility?.clientTruncated===false&&
            v.queryVisibility?.hasFromIssues===true&&v.queryVisibility?.hasForUpdate===true&&
            v.lockTypes.includes('transactionid')&&v.lockModes.includes('ShareLock'));
          const lockOracle=Object.entries(locks).every(([label,d])=>{
            if(!d||d.writerOk!==true||d.spawnCount!==0||d.serviceRowCount!==0||
               d.runIds.length!==1||d.runIds[0]!==d.sourceRunId||
               d.originalAdapterCalls.length!==1||d.originalAdapterCalls[0]!==d.sourceRunId||
               d.lockEvidence.length!==2)return false;
            const dFirst=label.endsWith('d_first');
            const expected=dFirst
              ? [['w009-D','w009-gate'],['w009-writer','w009-D']]
              : [['w009-writer','w009-gate'],['w009-D','w009-writer']];
            const actual=d.lockEvidence.map(x=>[x.waiterName,x.blockerName]);
            if(JSON.stringify(actual)!==JSON.stringify(expected)||
               !d.lockEvidence.every(x=>x?.proven===true&&x.waiterPid>0&&x.blockerPid>0&&x.blockingLockTypes.length>0))return false;
            const issueWait=d.lockEvidence[1];
            if(issueWait.waitSqlKind!=='issues.select_for_update'||
               issueWait.queryVisibility?.captureComplete!==true||
               issueWait.queryVisibility?.clientTruncated!==false||
               issueWait.queryVisibility?.hasFromIssues!==true||
               issueWait.queryVisibility?.hasForUpdate!==true||
               !issueWait.blockingLockTypes.includes('transactionid')||
               !issueWait.blockingLockModes.includes('ShareLock'))return false;
            if(dFirst){
              if(d.dHttp!==200||d.finalStatus!=='done'||d.acceptedAuditRows!==1||
                 d.earlyIssueWait?.sqlKind!=='issues.select_for_update'||
                 d.earlyIssueWait?.serviceRowsBeforeRelease!==0||
                 d.earlyIssueWait?.spawnCountBeforeRelease!==0)return false;
            }else{
              if(d.dHttp!==409||d.finalStatus!=='in_review'||d.acceptedAuditRows!==0)return false;
            }
            if(label.startsWith('quarantine_')&&d.quarantineRescueStub!==true)return false;
            return true;
          });

          const out={
            schema:'p04-int2-w021-classification.v1',
            base:'efcd44a05bfdd74bdc6551289e1c4b452850ee5a',
            sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,
            setup:{install:code('install'),sdk:code('sdk'),migrations:code('migrations'),typecheck:code('typecheck')},
            cases,locks,preflights,preassert,cleanup,stages,
            oracles:{infra,passes,cleanupPass,visibilityOracle,preassertOracle,lockOracle},
            scope:'four existing reconcile contention selectors only; P04 status remains coordinator-owned',
          };
          out.overall=infra&&passes&&cleanupPass&&visibilityOracle&&preassertOracle&&lockOracle?'PASS_SCOPED':'FAIL_OR_NOT_RUN';
          write('classification.json',out);
          if(read('identity.txt'))fs.copyFileSync(dir+'/identity.txt',safe+'/identity.txt');
          if(read('changed-files.txt'))fs.copyFileSync(dir+'/changed-files.txt',safe+'/changed-files.txt');
          if(read('source-sha256.txt'))fs.copyFileSync(dir+'/source-sha256.txt',safe+'/source-sha256.txt');
          for(const n of ['install','sdk','migrations','typecheck',...Object.keys(names)]){
            if(read(n+'.exit_code')!==null)fs.copyFileSync(dir+'/'+n+'.exit_code',safe+'/'+n+'.exit_code');
          }
          console.log(JSON.stringify({overall:out.overall,sha:out.sha,run:out.run,
            cases:Object.fromEntries(Object.entries(cases).map(([k,v])=>[k,v.classification])),oracles:out.oracles}));
          if(out.overall!=='PASS_SCOPED')process.exitCode=1;
          NODE

      - name: Always verify SAFE publication scope and hash every evidence file
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .int2-safe
          unsafe=0
          : > .int2-safe/withheld-evidence.txt
          while IFS= read -r -d '' path; do
            if grep -Eiq 'params:|authorization:|bearer[[:space:]]|secret[[:space:]]*[:=]|password[[:space:]]*[:=]|BEGIN[[:space:]]+PRIVATE[[:space:]]+KEY' "$path"; then
              printf 'WITHHELD_SAFETY_CHECK: %s\n' "$(basename "$path")" >> .int2-safe/withheld-evidence.txt
              mv -- "$path" "$RUNNER_TEMP/w01-021-withheld-$(basename "$path")"
              unsafe=1
            fi
          done < <(find .int2-safe -maxdepth 1 -type f ! -name withheld-evidence.txt -print0)
          printf 'safe_scan=%s\nraw_logs_and_vitest_reports=NOT_PUBLISHED\n' "$unsafe" > .int2-safe/scope-scan.txt
          find .int2-safe -maxdepth 1 -type f ! -name evidence-sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > .int2-safe/evidence-sha256.txt
          test "$unsafe" -eq 0

      - name: Always upload sanitized W021 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w01-021-four-safe-evidence
          path: .int2-safe/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Ensure source checkout has no tracked modifications
        if: always()
        run: git diff --exit-code
