# W01-015: test-only two-file oracle correction, single six-selector CI.
name: Sensor P04 W01-015 lock query oracle
on:
  push:
    branches: [codex/w01-015-int2-lock-oracle]
    paths: [.github/workflows/sensor-p04-int2-first-red.yml]
permissions:
  contents: read
concurrency:
  group: sensor-p04-w01-015-one-run
  cancel-in-progress: false
jobs:
  isolated-postgres:
    if: github.repository == 'ra-fares/paperclip' && github.ref == 'refs/heads/codex/w01-015-int2-lock-oracle'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      PAPERCLIP_TELEMETRY_ENABLED: 'false'
      NO_COLOR: '1'
    steps:
      - name: Checkout exact commit without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 40

      - name: Exact base, three-file allowlist, immutable source manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .int2-evidence .int2-safe "$RUNNER_TEMP/w01-015-home"
          echo "PAPERCLIP_HOME=$RUNNER_TEMP/w01-015-home" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base=0a5b430b53f0f1cde41a0c680e665ddb8c49b331
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-only "$base" HEAD > .int2-evidence/changed-files.txt
          while IFS= read -r p; do
            case "$p" in
              server/src/__tests__/issue-stalled-review-decision-routes.test.ts|.github/workflows/sensor-p04-int2-first-red.yml) ;;
              *) echo "OUTSIDE_W015_ALLOWLIST" >&2; exit 1 ;;
            esac
          done < .int2-evidence/changed-files.txt
          test "$(wc -l < .int2-evidence/changed-files.txt)" -eq 2
          test -z "$(git diff --diff-filter=D --name-only "$base" HEAD)"
          printf 'ASSIGNMENT=W01-015\nBASE=%s\nSHA=%s\nRUN=%s\nATTEMPT=%s\n' "$base" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .int2-evidence/identity.txt
          git status --short --untracked-files=all > .int2-evidence/initial-git-status.txt
          sha256sum server/src/__tests__/issue-stalled-review-decision-routes.test.ts .github/workflows/sensor-p04-int2-first-red.yml > .int2-evidence/source-sha256.txt

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: pnpm 9.15.4
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false

      - name: Frozen install, build prerequisites, migration integrity, typecheck
        shell: bash
        run: |
          set -euo pipefail
          node --version > .int2-evidence/node-version.txt
          pnpm --version > .int2-evidence/pnpm-version.txt
          if pnpm install --frozen-lockfile > .int2-evidence/install.log 2>&1; then install_code=0; else install_code=$?; fi
          printf '%s\n' "$install_code" > .int2-evidence/install.exit_code
          test "$install_code" -eq 0
          if pnpm --filter @paperclipai/plugin-sdk ensure-build-deps > .int2-evidence/sdk.log 2>&1; then sdk_code=0; else sdk_code=$?; fi
          printf '%s\n' "$sdk_code" > .int2-evidence/sdk.exit_code
          test "$sdk_code" -eq 0
          test -f server/node_modules/vitest/vitest.mjs
          if pnpm --filter @paperclipai/db run check:migrations > .int2-evidence/migrations.stdout 2> .int2-evidence/migrations.stderr; then migration_code=0; else migration_code=$?; fi
          printf '%s\n' "$migration_code" > .int2-evidence/migrations.exit_code
          test "$migration_code" -eq 0
          if pnpm --filter @paperclipai/server typecheck > .int2-evidence/typecheck.stdout 2> .int2-evidence/typecheck.stderr; then type_code=0; else type_code=$?; fi
          printf '%s\n' "$type_code" > .int2-evidence/typecheck.exit_code
          test "$type_code" -eq 0

      - name: Six exact selectors, real isolated PostgreSQL and safe fake spawn
        shell: bash
        run: |
          set -euo pipefail
          export INT2_W013_EVIDENCE_DIR="$GITHUB_WORKSPACE/.int2-evidence"
          export INT2_W012_EVIDENCE_DIR="$GITHUB_WORKSPACE/.int2-evidence"
          export INT2_W011_EVIDENCE_DIR="$GITHUB_WORKSPACE/.int2-evidence"
          export INT2_W009_EVIDENCE_DIR="$GITHUB_WORKSPACE/.int2-evidence"
          export INT2_POSITIVE_BCD_OBSERVATION_PATH="$GITHUB_WORKSPACE/.int2-evidence/document-observation.json"
          export INT2_HTTP_ABA_OBSERVATION_PATH="$GITHUB_WORKSPACE/.int2-evidence/http-aba-observation.json"

          run_named() {
            local label="$1" pattern="$2" code
            if node server/node_modules/vitest/vitest.mjs run --root server src/__tests__/issue-stalled-review-decision-routes.test.ts --reporter=json --outputFile="$GITHUB_WORKSPACE/.int2-evidence/vitest-$label.json" -t "$pattern" > ".int2-evidence/$label.stdout" 2> ".int2-evidence/$label.stderr"; then
              code=0
            else
              code=$?
            fi
            printf '%s\n' "$code" > ".int2-evidence/$label.exit_code"
            echo "SELECTOR=$label EXIT=$code"
            # No unredacted Vitest tails to Actions logs.
          }

          # These two controls always execute, even if the first is semantically RED.
          run_named runtime_writer_first 'P04 INT2 W009 lock_runtime_writer_first: genuine BCD and PG lock'
          run_named runtime_d_first 'P04 INT2 W009 lock_runtime_d_first: genuine BCD and PG lock'
          if [ "$(cat .int2-evidence/runtime_writer_first.exit_code)" -ne 0 ] || [ "$(cat .int2-evidence/runtime_d_first.exit_code)" -ne 0 ]; then
            echo 'Normal controls failed; remaining four selectors NOT_RUN' >&2
            exit 1
          fi

          run_named retry_writer_first 'P04 INT2 W009 lock_retry_writer_first: genuine BCD and PG lock'
          test "$(cat .int2-evidence/retry_writer_first.exit_code)" -eq 0
          run_named retry_d_first 'P04 INT2 W009 lock_retry_d_first: genuine BCD and PG lock'
          test "$(cat .int2-evidence/retry_d_first.exit_code)" -eq 0
          run_named document 'P04 INT2 BCD document: actual admitted run and independent reviewer'
          test "$(cat .int2-evidence/document.exit_code)" -eq 0
          run_named http_aba 'P04 INT2 HTTP execution workspace branch ABA must reject stale candidate'
          test "$(cat .int2-evidence/http_aba.exit_code)" -eq 0

      - name: Always classify and materialize SAFE evidence only
        if: always()
        shell: bash
        run: |
          mkdir -p .int2-evidence .int2-safe
          node <<'NODE'
          const fs=require('node:fs'),dir='.int2-evidence',safe='.int2-safe';
          const names={
            runtime_writer_first:'P04 INT2 W009 lock_runtime_writer_first: genuine BCD and PG lock',
            runtime_d_first:'P04 INT2 W009 lock_runtime_d_first: genuine BCD and PG lock',
            retry_writer_first:'P04 INT2 W009 lock_retry_writer_first: genuine BCD and PG lock',
            retry_d_first:'P04 INT2 W009 lock_retry_d_first: genuine BCD and PG lock',
            document:'P04 INT2 BCD document: actual admitted run and independent reviewer',
            http_aba:'P04 INT2 HTTP execution workspace branch ABA must reject stale candidate',
          };
          const mode={runtime_writer_first:'lock_runtime_writer_first',runtime_d_first:'lock_runtime_d_first',
            retry_writer_first:'lock_retry_writer_first',retry_d_first:'lock_retry_d_first'};
          const read=n=>{try{return fs.readFileSync(dir+'/'+n,'utf8')}catch{return null}};
          const json=n=>{try{return JSON.parse(read(n))}catch{return null}};
          const code=n=>{const s=read(n+'.exit_code');return s===null?null:Number(s.trim())};
          const write=(n,v)=>fs.writeFileSync(safe+'/'+n,JSON.stringify(v,null,2)+'\n');
          const summary=(label,name)=>{
            const report=json('vitest-'+label+'.json');
            const all=(report?.testResults??[]).flatMap(x=>x.assertionResults??[]);
            const selected=all.filter(t=>t.fullName===name||t.fullName?.endsWith(name));
            const executed=all.filter(t=>t.status==='passed'||t.status==='failed');
            const pass=selected.length===1&&executed.length===1&&selected[0].status==='passed'&&
              code(label)===0&&report?.numPassedTests===1&&report?.numFailedTests===0;
            return {name,selected:selected.length,executed:executed.length,
              status:selected[0]?.status??null,exitCode:code(label),
              classification:pass?'PASS':selected.length===0||executed.length===0?'NOT_RUN':'FAIL',
              failureCount:selected[0]?.failureMessages?.length??0};
          };
          const safeLocks=(label)=>{
            const d=json('lock-'+mode[label]+'.json');
            if(!d)return null;
            return {
              sourceRunId:d.sourceRunId,candidateId:d.candidateId,
              dHttp:d.dHttp,finalStatus:d.finalStatus,acceptedAuditRows:d.acceptedAuditRows,
              writerOk:d.writerResult?.ok,spawnCount:d.spawnCount,
              runIds:d.runIds??[],originalAdapterCalls:d.originalAdapterCalls??[],
              serviceRows:(d.serviceRows??[]).map(x=>({id:x.id,status:x.status,port:x.port})),
              earlyIssueWait:d.earlyIssueWait??null,
              lockEvidence:(d.lockEvidence??[]).map(x=>({
                waiterName:x.waiterName,blockerName:x.blockerName,waiterPid:x.waiterPid,blockerPid:x.blockerPid,
                waitEvent:x.waitEvent,waitSqlKind:x.waitSqlKind,blockerSqlKind:x.blockerSqlKind,
                blockingLockTypes:x.blockingLockTypes,blockingLockModes:x.blockingLockModes,proven:x.proven,
              })),
            };
          };
          const queryKinds=['issues.select_for_key_share','issues.select_for_update','issues.update','project_workspaces.select_for_update','execution_workspaces.select_for_update','advisory_lock','other'];
          const kind=v=>queryKinds.includes(v)?v:'other';
          const pid=v=>Number.isSafeInteger(v)&&v>0?v:null;
          const stageRows=(name)=>{
            const v=read('stages-'+name+'.jsonl');
            if(!v)return [];
            return v.split('\n').filter(Boolean).flatMap(line=>{
              try{
                const x=JSON.parse(line);
                const detail=x.stage==='pre_assert_wait_recorded'?{
                  assertionId:['w015_d_first_early_issue_wait','w015_writer_first_receipt_lock'].includes(x.assertionId)?x.assertionId:null,
                  expectedQueryKind:kind(x.expectedQueryKind),actualQueryKind:kind(x.actualQueryKind),
                  waiterPid:pid(x.waiterPid),blockerPid:pid(x.blockerPid),
                  observedBlockingEdge:x.observedBlockingEdge===true,
                }:null;
                return [{sequence:x.sequence,stage:x.stage,mode:x.mode,...(detail?{detail}:{})}];
              }catch{return []}
            });
          };
          const stages={};
          const cleanup={};
          for(const [label,m] of Object.entries(mode)){
            stages[label]=stageRows(m);
            const last=stages[label].at(-1);
            cleanup[label]={last:last?.stage??null,outerComplete:stages[label].some(x=>x.stage==='outer_cleanup_complete'),
              contentionComplete:stages[label].some(x=>x.stage==='contention_cleanup_complete')};
          }
          stages.document=stageRows('document');
          stages.http_aba=stageRows('execution_workspace_branch_aba_http');
          cleanup.document={outerComplete:stages.document.some(x=>x.stage==='outer_cleanup_complete')};
          cleanup.http_aba={outerComplete:stages.http_aba.some(x=>x.stage==='outer_cleanup_complete')};
          const cases=Object.fromEntries(Object.entries(names).map(([k,v])=>[k,summary(k,v)]));
          for(const [k,v] of Object.entries(cases))write('vitest-'+k+'-summary.json',v);
          const preassert=Object.fromEntries(Object.entries(mode).map(([label,m])=>{
            const v=json('preassert-'+m+'.json');
            if(!v)return [label,null];
            const safeArray=(xs,allow)=>Array.isArray(xs)?xs.slice(0,8).map(x=>allow.includes(x)?x:'other'):[];
            const safeBool=x=>typeof x==='boolean'?x:null;
            return [label,{
              schema:'p04-int2-w015-preassert.v1',case:m,mode:m,
              assertionId:['w015_d_first_early_issue_wait','w015_writer_first_receipt_lock'].includes(v.assertionId)?v.assertionId:null,
              expectedQueryKind:kind(v.expectedQueryKind),actualQueryKind:kind(v.actualQueryKind),
              waiterRole:['w009-D','w009-writer','w009-gate'].includes(v.waiterRole)?v.waiterRole:null,
              blockerRole:['w009-D','w009-writer','w009-gate'].includes(v.blockerRole)?v.blockerRole:null,
              waiterPid:pid(v.waiterPid),blockerPid:pid(v.blockerPid),
              waitEvent:['transactionid','tuple','relation','advisory','other'].includes(v.waitEvent)?v.waitEvent:'other',
              lockTypes:safeArray(v.lockTypes,['transactionid','tuple','relation','advisory','virtualxid','other']),
              lockModes:safeArray(v.lockModes,['ShareLock','ExclusiveLock','RowShareLock','RowExclusiveLock','AccessShareLock','AccessExclusiveLock','ShareUpdateExclusiveLock','ShareRowExclusiveLock','other']),
              observedBlockingEdge:v.observedBlockingEdge===true,
              pending:{d:safeBool(v.pending?.d),writer:safeBool(v.pending?.writer),gate:safeBool(v.pending?.gate)},
              cleanup:{contentionComplete:safeBool(v.cleanup?.contentionComplete),outerComplete:safeBool(v.cleanup?.outerComplete)},
              httpCode:Number.isInteger(v.httpCode)?v.httpCode:null,
              finalStatus:['done','in_review','running','starting'].includes(v.finalStatus)?v.finalStatus:null,
              auditCount:Number.isSafeInteger(v.auditCount)?v.auditCount:null,
              runs:Number.isSafeInteger(v.runs)?v.runs:null,
              calls:Number.isSafeInteger(v.calls)?v.calls:null,
              spawns:Number.isSafeInteger(v.spawns)?v.spawns:null,
            }];
          }));
          const locks=Object.fromEntries(Object.keys(mode).map(k=>[k,safeLocks(k)]));
          const lockOracle=Object.entries(locks).every(([label,d])=>{
            if(!d||d.dHttp!==200||d.finalStatus!=='done'||d.acceptedAuditRows!==1||d.writerOk!==true||
              d.lockEvidence.length!==(label.endsWith('d_first')?2:1))return false;
            const pair=d.lockEvidence.map(x=>[x.waiterName,x.blockerName]);
            const wanted=label.endsWith('d_first')
              ? [['w009-D','w009-gate'],['w009-writer','w009-D']]
              : [['w009-D','w009-writer']];
            if(JSON.stringify(pair)!==JSON.stringify(wanted))return false;
            if(!d.lockEvidence.every(x=>x.proven===true&&Number(x.waiterPid)>0&&
              Number(x.blockerPid)>0&&x.blockingLockTypes?.length>0))return false;
            const early=label.endsWith('d_first');
            const issueWait=d.lockEvidence.at(-1);
            if(issueWait.waitSqlKind!==(early?'issues.select_for_key_share':'issues.select_for_update')||
              !issueWait.blockingLockTypes.includes('transactionid')||
              !issueWait.blockingLockModes.includes('ShareLock'))return false;
            if(early&&(!d.earlyIssueWait||d.earlyIssueWait.sqlKind!=='issues.select_for_key_share'||
              d.earlyIssueWait.serviceRowsBeforeRelease!==(label.startsWith('retry_')?1:0)||
              d.earlyIssueWait.spawnCountBeforeRelease!==(label.startsWith('retry_')?1:0)))return false;
            if(d.spawnCount!==(label.startsWith('retry_')?2:1))return false;
            if(!d.runIds.includes(d.sourceRunId)||
              d.originalAdapterCalls.filter(id=>id===d.sourceRunId).length!==1)return false;
            return true;
          });
          const doc=json('document-observation.json');
          const aba=json('http-aba-observation.json');
          const documentary=doc?{
            sourceRunId:doc.sourceRunId,sourceTerminal:doc.sourceTerminal,
            reviewerHttp:doc.reviewerHttp,after:doc.after,acceptedAuditRows:doc.acceptedAuditRows,
            observedRuns:doc.observedRuns,adapterCalls:doc.adapterCalls,admissionChecks:doc.admissionChecks
          }:null;
          const httpAba=aba?{
            sourceRunId:aba.sourceRunId,stage:aba.stage,preconditionsValid:aba.preconditionsValid,
            reviewerHttp:aba.reviewerHttp,reviewerCode:aba.reviewerCode,
            finalStatus:aba.finalStatus,acceptedAuditRows:aba.acceptedAuditRows,
            allRuns:aba.allRuns,admissionChecks:aba.admissionChecks,
            adapterCalls:aba.adapterCalls,actualAdapterCalls:aba.actualAdapterCalls
          }:null;
          const out={
            schema:'p04-int2-w015-classification.v1',base:'0a5b430b53f0f1cde41a0c680e665ddb8c49b331',
            sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,
            setup:{install:code('install'),sdk:code('sdk'),migrations:code('migrations'),typecheck:code('typecheck')},
            cases,locks,preassert,stages,cleanup,documentary,httpAba,lockOracle,
            scopeRemaining:'reconcile/indirect/rollback NOT_RUN; P04 OPEN',
          };
          const preassertOracle=Object.entries(preassert).every(([label,v])=>v!==null&&
            v.observedBlockingEdge&&v.waiterPid>0&&v.blockerPid>0&&
            v.expectedQueryKind===v.actualQueryKind&&
            v.expectedQueryKind===(label.endsWith('d_first')?'issues.select_for_key_share':'issues.select_for_update'));
          out.preassertOracle=preassertOracle;
          const passes=Object.values(cases).every(c=>c.classification==='PASS');
          const cleanupPass=Object.values(cleanup).every(x=>x.outerComplete===true);
          const infra=Object.values(out.setup).every(x=>x===0);
          const docPass=documentary?.reviewerHttp===200&&documentary?.after==='done'&&documentary?.acceptedAuditRows===1;
          const abaPass=httpAba?.reviewerHttp===409&&httpAba?.finalStatus==='in_review'&&
            httpAba?.acceptedAuditRows===0&&httpAba?.preconditionsValid===true;
          out.overall=infra&&passes&&lockOracle&&preassertOracle&&cleanupPass&&docPass&&abaPass?'PASS_SCOPED':'FAIL_OR_NOT_RUN';
          write('classification.json',out);
          for(const [label,v] of Object.entries(stages))write('stages-'+label+'.json',v);
          if(read('identity.txt'))fs.copyFileSync(dir+'/identity.txt',safe+'/identity.txt');
          if(read('changed-files.txt'))fs.copyFileSync(dir+'/changed-files.txt',safe+'/changed-files.txt');
          if(read('source-sha256.txt'))fs.copyFileSync(dir+'/source-sha256.txt',safe+'/source-sha256.txt');
          for(const n of ['install','sdk','migrations','typecheck',...Object.keys(names)]){
            if(read(n+'.exit_code')!==null)fs.copyFileSync(dir+'/'+n+'.exit_code',safe+'/'+n+'.exit_code');
          }
          console.log(JSON.stringify({overall:out.overall,sha:out.sha,run:out.run,
            cases:Object.fromEntries(Object.entries(cases).map(([k,v])=>[k,v.classification])),
            lockOracle,preassertOracle,cleanupPass,docPass,abaPass}));
          if(out.overall!=='PASS_SCOPED')process.exitCode=1;
          NODE

      - name: Always verify SAFE publication scope and hash every evidence file
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .int2-safe
          unsafe=0
          : > .int2-safe/withheld-evidence.txt
          while IFS= read -r -d '' path; do
            if grep -Eiq 'params:|authorization:|bearer[[:space:]]|secret[[:space:]]*[:=]|password[[:space:]]*[:=]|BEGIN[[:space:]]+PRIVATE[[:space:]]+KEY' "$path"; then
              printf 'WITHHELD_SAFETY_CHECK: %s\n' "$(basename "$path")" >> .int2-safe/withheld-evidence.txt
              # The unsafe evidence is never uploaded, regardless of test outcome.
              mv -- "$path" "$RUNNER_TEMP/w01-015-withheld-$(basename "$path")"
              unsafe=1
            fi
          done < <(find .int2-safe -maxdepth 1 -type f ! -name withheld-evidence.txt -print0)
          printf 'safe_scan=%s\nraw_logs_and_vitest_reports=NOT_PUBLISHED\n' "$unsafe" > .int2-safe/scope-scan.txt
          find .int2-safe -maxdepth 1 -type f ! -name evidence-sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > .int2-safe/evidence-sha256.txt
          test "$unsafe" -eq 0

      - name: Always upload sanitized W015 evidence (no raw test logs or SQL params)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w01-015-six-safe-evidence
          path: .int2-safe/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Ensure source checkout has no tracked modifications
        if: always()
        run: git diff --exit-code
