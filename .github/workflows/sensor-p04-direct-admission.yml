# T-P04-DIRECT-ADMISSION-01: RED/GREEN CI, no real providers or models.
# This runner verifies test-only spies and blocks provider/model execution.
name: Sensor P04 direct admission DB
on:
  push:
    branches:
      - ci/T-P04-DIRECT-ADMISSION-01
      - ci/T-P04-DIRECT-ADMISSION-DETACH-RED
      - ci/T-P04-DIRECT-ADMISSION-RACE-RED
      - ci/T-P04-ISSUE-GOVERNANCE-01
      - impl/T-P04-DIRECT-ALLOW-01
    paths:
      - .github/workflows/sensor-p04-direct-admission.yml
      - server/src/__tests__/heartbeat-sensor-direct-admission.integration.test.ts
      - server/src/services/heartbeat.ts
      - server/src/services/sensor-direct-admission.ts
      - server/src/services/sensor-admission-verifier.ts
      - server/src/services/native-runtime/sensor-admission.ts
      - server/src/services/native-runtime/sensor-admission.test.ts
      - server/src/services/native-runtime/sensor-admission.integration.test.ts
      - server/src/services/documents.ts
      - server/src/services/issues.ts
      - server/src/modules/run-dispatch/**
      - packages/db/src/schema/issues.ts
      - packages/db/src/migrations/0293_sensor_issue_governance.sql
      - packages/db/src/migrations/meta/**
      - packages/db/src/sensor-issue-governance-migration.test.ts
permissions:
  contents: read
concurrency:
  group: sensor-p04-direct-admission-${{ github.ref }}
  cancel-in-progress: false
jobs:
  direct-db-test:
    if: github.repository == 'ra-fares/paperclip' && (github.ref == 'refs/heads/ci/T-P04-DIRECT-ADMISSION-01' || github.ref == 'refs/heads/ci/T-P04-DIRECT-ADMISSION-DETACH-RED' || github.ref == 'refs/heads/ci/T-P04-DIRECT-ADMISSION-RACE-RED' || github.ref == 'refs/heads/ci/T-P04-ISSUE-GOVERNANCE-01' || github.ref == 'refs/heads/impl/T-P04-DIRECT-ALLOW-01')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      DATABASE_URL: postgres://p04_direct_test:p04_direct_ci_only@127.0.0.1:5432/paperclip_p04_direct_admission_01_ci
      PAPERCLIP_TEST_DATABASE_URL: postgres://p04_direct_test:p04_direct_ci_only@127.0.0.1:5432/paperclip_p04_direct_admission_01_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: p04_direct_test
          POSTGRES_PASSWORD: p04_direct_ci_only
          POSTGRES_DB: paperclip_p04_direct_admission_01_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p04_direct_test -d paperclip_p04_direct_admission_01_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact isolated test commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "P04 direct test SHA: $GITHUB_SHA"
          echo "Based on accepted native DB3 source c9005f78294d6e6748517e8845cb360f0ab9d9ee"
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Setup pnpm 9.15.4
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
          run_install: false
      - name: Install declared dependencies only
        run: pnpm install --frozen-lockfile
      - name: Assert isolated database identity
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.postgres.id }}" psql -U p04_direct_test -d paperclip_p04_direct_admission_01_ci -Atqc 'SELECT current_database()' | grep -Fx 'paperclip_p04_direct_admission_01_ci'
      - name: Prepare real pre-0293 rows on schema 0292
        shell: bash
        env:
          P04_BACKFILL_SEED: 'true'
        run: |
          set -euo pipefail
          migration=packages/db/src/migrations/0293_sensor_issue_governance.sql
          journal=packages/db/src/migrations/meta/_journal.json
          cp "$migration" "$RUNNER_TEMP/p04-0293.sql"
          cp "$journal" "$RUNNER_TEMP/p04-journal.json"
          restore_migration() {
            cp "$RUNNER_TEMP/p04-0293.sql" "$migration"
            cp "$RUNNER_TEMP/p04-journal.json" "$journal"
          }
          trap restore_migration EXIT
          rm "$migration"
          node -e "const fs=require('node:fs'); const p='packages/db/src/migrations/meta/_journal.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); if(j.entries.at(-1)?.tag!=='0293_sensor_issue_governance')throw Error('P04 migration head differs'); j.entries.pop();fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n')"
          pnpm --filter @paperclipai/db migrate
          pnpm --dir packages/db exec vitest run src/sensor-issue-governance-migration.test.ts --reporter=verbose -t "P04 pre-0293 fixture seed"
      - name: Apply PostgreSQL migrations
        run: pnpm --filter @paperclipai/db migrate
      - name: Verify server TypeScript before RED tests
        run: pnpm --filter @paperclipai/server typecheck
      - name: Assert three focused suites exist (never silently skip)
        shell: bash
        run: |
          set -euo pipefail
          test -s packages/db/src/sensor-issue-governance-migration.test.ts
          test -s server/src/modules/run-dispatch/adapters/postgres.test.ts
          test -s server/src/__tests__/heartbeat-sensor-direct-admission.integration.test.ts
      - name: Verify durable Sensor migration and SQL guards
        run: pnpm --dir packages/db exec vitest run src/sensor-issue-governance-migration.test.ts --reporter=verbose
      - name: Verify run-dispatch Postgres adapter
        run: pnpm --dir server exec vitest run src/modules/run-dispatch/adapters/postgres.test.ts --reporter=verbose
      - name: Assert direct tests exist (never skip)
        run: test -s server/src/__tests__/heartbeat-sensor-direct-admission.integration.test.ts
      - name: Verify governed direct denial + no-document legacy
        run: pnpm --dir server exec vitest run src/__tests__/heartbeat-sensor-direct-admission.integration.test.ts --reporter=verbose
      - name: Native P04 unit regression
        run: pnpm --dir server exec vitest run src/services/native-runtime/sensor-admission.test.ts --reporter=verbose
      - name: Prepare second isolated native DB and migrate
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.postgres.id }}" psql -U p04_direct_test -d postgres -c 'CREATE DATABASE paperclip_p04_db_acceptance_01_ci'
          PAPERCLIP_TEST_DATABASE_URL=postgres://p04_direct_test:p04_direct_ci_only@127.0.0.1:5432/paperclip_p04_db_acceptance_01_ci DATABASE_URL=postgres://p04_direct_test:p04_direct_ci_only@127.0.0.1:5432/paperclip_p04_db_acceptance_01_ci pnpm --filter @paperclipai/db migrate
      - name: Native P04 real-DB regression
        env:
          PAPERCLIP_TEST_DATABASE_URL: postgres://p04_direct_test:p04_direct_ci_only@127.0.0.1:5432/paperclip_p04_db_acceptance_01_ci
        run: pnpm --dir server exec vitest run src/services/native-runtime/sensor-admission.integration.test.ts --reporter=verbose
      - name: Check working tree integrity
        if: always()
        run: git diff --exit-code
